# Dev API on Fly.io. Prod is a separate app (fly.prod.toml).
# Create the app once with flyctl; CI must never create or destroy it.
#
# Always run flyctl from the repository root so the Docker context is the whole repo:
#   fly deploy . --config infrastructure/fly/fly.dev.toml
app = "fishing-logbook-dev-api"
primary_region = "iad"

[build]
  # Path is relative to this toml, not the deploy context.
  dockerfile = "../../Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_HTTP_PORTS = "8080"
  ExternalLogging__Environment = "dev"
  Build__Environment = "dev"
  Cors__AllowedOrigins__0 = "https://fishing-logbook-dev.pages.dev"
  Cors__AllowedOrigins__1 = "https://localhost:7005"
  Cors__AllowedOrigins__2 = "http://localhost:5019"
  Auth__Authority = "https://cognito-idp.eu-west-2.amazonaws.com/eu-west-2_J4Kt9QB06"
  Auth__ClientId = "e80socqio7bpv79or57fb1e5l"
  Auth__ApiScope = "https://fishing-logbook-dev-api.fly.dev/access"
  Auth__ApiResource = "https://fishing-logbook-dev-api.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
