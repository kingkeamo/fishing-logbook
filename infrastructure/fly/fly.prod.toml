# Prod API on Fly.io. Do not use this file until the prod app has been created manually.
# Create the app once with flyctl; CI must never create or destroy it.
#
#   fly deploy . --config infrastructure/fly/fly.prod.toml
app = "fishing-logbook-prod-api"
primary_region = "iad"

[build]
  # Path is relative to this toml, not the deploy context.
  dockerfile = "../../Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_HTTP_PORTS = "8080"
  ExternalLogging__Environment = "prod"
  Build__Environment = "prod"
  Cors__AllowedOrigins__0 = "https://app.catchbutdontforget.com"
  Auth__ApiScope = "https://api.catchbutdontforget.com/access"
  Auth__ApiResource = "https://api.catchbutdontforget.com"
  # Auth__Authority and Auth__ApprovedClientIds__0 are supplied after Cognito is created.
  # Add Auth__ApprovedClientIds__1 only when the Prod native client exists; never set an
  # empty value or copy Dev identifiers here.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
