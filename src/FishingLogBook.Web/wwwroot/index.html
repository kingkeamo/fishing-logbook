<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>FishingLogBook</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="FishingLogBook.Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <meta name="theme-color" content="#00695c" />
    <script type="importmap"></script>
    <script>
        if (location.href.endsWith('?')) {
            location.replace(location.pathname || '/');
        }
        window.fishingLogBookCulture = {
            get: () => {
                try { return localStorage.getItem('fishinglogbook-culture'); }
                catch { return null; }
            },
            set: (value) => {
                try { localStorage.setItem('fishinglogbook-culture', value); } catch { /* ignore */ }
                document.documentElement.lang = value;
            },
            browser: () => navigator.language || 'en-GB',
            reload: () => {
                location.replace(`${location.origin}${location.pathname || '/'}`);
            }
        };
        window.fishingLogBookNetwork = {
            isOnline: () => navigator.onLine,
            onOnline: (helper) => {
                window.addEventListener('online', () => {
                    helper.invokeMethodAsync('OnBrowserOnline');
                });
            }
        };
        const storedCulture = window.fishingLogBookCulture.get();
        if (storedCulture) {
            document.documentElement.lang = storedCulture;
        }
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        (async () => {
            const epoch = '20260814-cache-first-unredirected';
            try {
                if (localStorage.getItem('flb-sw-epoch') !== epoch) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map(registration => registration.unregister()));
                    const keys = await caches.keys();
                    await Promise.all(keys.map(key => caches.delete(key)));
                    localStorage.setItem('flb-sw-epoch', epoch);
                }
            } catch { /* ignore */ }
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
        })();
    </script>
</body>

</html>
