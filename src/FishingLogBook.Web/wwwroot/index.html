<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Catch, But Don’t Forget</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="FishingLogBook.Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#0b1f3a" />
    <script type="importmap"></script>
    <script>
        if (location.href.endsWith('?')) {
            location.replace(location.pathname || '/');
        }
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui" role="alert">
        <div class="blazor-error-card">
            <svg class="blazor-error-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 4a1 1 0 0 1 1 1v6a1 1 0 0 1-2 0V7a1 1 0 0 1 1-1zm0 12.5a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z" />
            </svg>
            <p class="blazor-error-title">Something went wrong</p>
            <p class="blazor-error-message">We couldn't load this screen. Try again, or return home.</p>
            <a href="." class="blazor-error-action blazor-error-action-primary reload">Try again</a>
            <a href="/" class="blazor-error-action blazor-error-action-secondary">Go home</a>
        </div>
        <span class="dismiss" role="button" tabindex="0" aria-label="Dismiss">🗙</span>
    </div>
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script type="module">
        const { registerServiceWorker } = await import('./js/bootstrap/service-worker-registration.js');
        await registerServiceWorker();
        await import('./js/bootstrap/app.js');
        await Blazor.start();
    </script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
