<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>FishingLogBook JS harness</title>
</head>
<body>
    <p id="status">loading</p>
    <script type="module">
        import { putCatchWithPhotographs, getAllCatchesWithPhotographs, updateCatchMetadata } from '../../wwwroot/js/storage/catch-store.js';

        const ownerUserId = '11111111-1111-1111-1111-111111111111';

        window.harness = {
            async putAndGetCatch() {
                const catchId = '11111111-1111-1111-1111-111111111111';
                const photographId = '22222222-2222-2222-2222-222222222222';
                await putCatchWithPhotographs(
                    JSON.stringify({
                        id: catchId,
                        userId: ownerUserId,
                        caughtOn: '2026-08-17T08:00:00+00:00',
                        photographs: [{
                            id: photographId,
                            catchId,
                            contentType: 'image/jpeg'
                        }]
                    }),
                    [{
                        id: photographId,
                        catchId,
                        contentType: 'image/jpeg',
                        bytes: new Uint8Array([1, 2, 3])
                    }]
                );
                return getAllCatchesWithPhotographs(ownerUserId);
            },
            async putAndGetCatchWithProvenance() {
                const catchId = '11111111-1111-1111-1111-111111111111';
                const photographId = '22222222-2222-2222-2222-222222222222';
                await putCatchWithPhotographs(
                    JSON.stringify({
                        id: catchId,
                        userId: ownerUserId,
                        anglerUserId: ownerUserId,
                        recordedByUserId: ownerUserId,
                        caughtOn: '2026-08-17T08:00:00+00:00',
                        photographs: [{
                            id: photographId,
                            catchId,
                            contentType: 'image/jpeg'
                        }]
                    }),
                    [{
                        id: photographId,
                        catchId,
                        contentType: 'image/jpeg',
                        bytes: new Uint8Array([1, 2, 3])
                    }]
                );
                return getAllCatchesWithPhotographs(ownerUserId);
            },
            async putLegacyCatchWithoutProvenance() {
                const catchId = 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa';
                const photographId = 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb';
                await putCatchWithPhotographs(
                    JSON.stringify({
                        id: catchId,
                        userId: ownerUserId,
                        caughtOn: '2026-08-17T08:00:00+00:00',
                        photographs: [{
                            id: photographId,
                            catchId,
                            contentType: 'image/jpeg'
                        }]
                    }),
                    [{
                        id: photographId,
                        catchId,
                        contentType: 'image/jpeg',
                        bytes: new Uint8Array([4, 5, 6])
                    }]
                );
                return getAllCatchesWithPhotographs(ownerUserId);
            },
            async putAndGetCatchWithThreePhotographs() {
                const catchId = 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa';
                const photoA = '11111111-1111-1111-1111-111111111111';
                const photoB = '22222222-2222-2222-2222-222222222222';
                const photoC = '00000000-0000-0000-0000-000000000003';
                await putCatchWithPhotographs(
                    JSON.stringify({
                        id: catchId,
                        userId: ownerUserId,
                        caughtOn: '2026-08-17T08:00:00+00:00',
                        photographs: [
                            { id: photoA, catchId, contentType: 'image/jpeg' },
                            { id: photoB, catchId, contentType: 'image/png' },
                            { id: photoC, catchId, contentType: 'image/webp' }
                        ]
                    }),
                    [
                        { id: photoC, catchId, contentType: 'image/webp', bytes: new Uint8Array([3, 3, 3]) },
                        { id: photoA, catchId, contentType: 'image/jpeg', bytes: new Uint8Array([1, 1, 1]) },
                        { id: photoB, catchId, contentType: 'image/png', bytes: new Uint8Array([2, 2, 2]) }
                    ]
                );
                return getAllCatchesWithPhotographs(ownerUserId);
            },
            async putAndGetCatchWithLocation() {
                const catchId = '11111111-1111-1111-1111-111111111111';
                const photographId = '22222222-2222-2222-2222-222222222222';
                await putCatchWithPhotographs(
                    JSON.stringify({
                        id: catchId,
                        userId: ownerUserId,
                        caughtOn: '2026-08-17T08:00:00+00:00',
                        photographs: [{
                            id: photographId,
                            catchId,
                            contentType: 'image/jpeg'
                        }],
                        location: {
                            latitude: 53.2707,
                            longitude: -9.0568,
                            accuracyMetres: 12,
                            capturedOn: '2026-08-17T08:00:00+00:00',
                            source: 'DeviceGps',
                            visibility: 'Private',
                            consentVersion: '1'
                        }
                    }),
                    [{
                        id: photographId,
                        catchId,
                        contentType: 'image/jpeg',
                        bytes: new Uint8Array([1, 2, 3])
                    }]
                );
                return getAllCatchesWithPhotographs(ownerUserId);
            },
            async putLegacyCatchWithoutLocation() {
                const catchId = 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa';
                const photographId = 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb';
                await putCatchWithPhotographs(
                    JSON.stringify({
                        id: catchId,
                        userId: ownerUserId,
                        caughtOn: '2026-08-17T08:00:00+00:00',
                        photographs: [{
                            id: photographId,
                            catchId,
                            contentType: 'image/jpeg'
                        }]
                    }),
                    [{
                        id: photographId,
                        catchId,
                        contentType: 'image/jpeg',
                        bytes: new Uint8Array([4, 5, 6])
                    }]
                );
                return getAllCatchesWithPhotographs(ownerUserId);
            },
            async readCatches() {
                return getAllCatchesWithPhotographs(ownerUserId);
            },
            async transitionCatchSyncState() {
                const catchId = '11111111-1111-1111-1111-111111111111';
                const photographId = '22222222-2222-2222-2222-222222222222';
                await window.harness.putAndGetCatch();
                await updateCatchMetadata(JSON.stringify({
                    id: catchId,
                    userId: ownerUserId,
                    caughtOn: '2026-08-17T08:00:00+00:00',
                    syncStatus: 4,
                    metadataSyncStatus: 3,
                    photographs: [{
                        id: photographId,
                        catchId,
                        contentType: 'image/jpeg',
                        syncStatus: 4
                    }]
                }));
                return getAllCatchesWithPhotographs(ownerUserId);
            },
            async putUnscopedCatchThenReadAsFirstSigner() {
                const catchId = 'cccccccc-cccc-cccc-cccc-cccccccccccc';
                const photographId = 'unscoped-photo';
                const firstSignerUserId = '22222222-2222-2222-2222-222222222222';
                await putCatchWithPhotographs(
                    JSON.stringify({
                        id: catchId,
                        caughtOn: '2026-08-17T08:00:00+00:00',
                        photographs: [{
                            id: photographId,
                            catchId,
                            contentType: 'image/jpeg'
                        }],
                        location: {
                            latitude: 53.2707,
                            longitude: -9.0568
                        }
                    }),
                    [{
                        id: photographId,
                        catchId,
                        contentType: 'image/jpeg',
                        bytes: new Uint8Array([4, 5, 6])
                    }]
                );
                return {
                    firstSignerView: await getAllCatchesWithPhotographs(firstSignerUserId),
                    originalOwnerView: await getAllCatchesWithPhotographs(ownerUserId),
                    stored: await readRawCatch(catchId)
                };
            },
            async putCatchWithoutPhotographId() {
                try {
                    await putCatchWithPhotographs(
                        JSON.stringify({
                            id: 'orphan-catch',
                            caughtOn: '2026-08-17T08:00:00+00:00'
                        }),
                        [{
                            catchId: 'orphan-catch',
                            contentType: 'image/jpeg',
                            bytes: new Uint8Array([9])
                        }]
                    );
                    return { threw: false, items: await getAllCatchesWithPhotographs(ownerUserId) };
                } catch {
                    return { threw: true, items: await getAllCatchesWithPhotographs(ownerUserId) };
                }
            },
            async putAndEditCatchDetails() {
                const catchId = '11111111-1111-1111-1111-111111111111';
                const photographId = '22222222-2222-2222-2222-222222222222';
                await window.harness.putAndGetCatch();
                await putCatchWithPhotographs(
                    JSON.stringify({
                        id: catchId,
                        userId: ownerUserId,
                        anglerUserId: ownerUserId,
                        recordedByUserId: ownerUserId,
                        caughtOn: '2026-08-17T09:15:00+00:00',
                        speciesName: 'Pike',
                        weight: 2.5,
                        length: 64,
                        method: 'Lure',
                        baitOrLure: 'Spinner',
                        notes: 'Weedline',
                        syncStatus: 1,
                        metadataSyncStatus: 1,
                        photographs: [{
                            id: photographId,
                            catchId,
                            contentType: 'image/jpeg',
                            syncStatus: 3,
                            objectKey: 'catches/photo'
                        }]
                    }),
                    [{
                        id: photographId,
                        catchId,
                        contentType: 'image/jpeg',
                        bytes: new Uint8Array([1, 2, 3])
                    }]
                );
                return getAllCatchesWithPhotographs(ownerUserId);
            }
        };

        function readRawCatch(id) {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('FishingLogBook');
                request.onsuccess = () => {
                    const db = request.result;
                    const transaction = db.transaction('catches', 'readonly');
                    const getRequest = transaction.objectStore('catches').get(id);
                    getRequest.onsuccess = () => resolve(getRequest.result);
                    getRequest.onerror = () => reject(getRequest.error);
                    transaction.oncomplete = () => db.close();
                };
                request.onerror = () => reject(request.error);
            });
        }

        document.getElementById('status').textContent = 'ready';
    </script>
</body>
</html>
