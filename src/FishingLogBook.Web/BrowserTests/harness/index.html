<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>FishingLogBook JS harness</title>
</head>
<body>
    <p id="status">loading</p>
    <script type="module">
        import { getAllTestCatches, putTestCatch, putCatchWithPhotographs, getAllCatchesWithPhotographs } from '../../wwwroot/js/storage/catch-store.js';
        import { getTestCatchPhotograph, putTestCatchPhotograph } from '../../wwwroot/js/storage/photo-store.js';
        import { putDiagnosticEvent } from '../../wwwroot/js/storage/diagnostic-store.js';

        const ownerUserId = '11111111-1111-1111-1111-111111111111';

        window.harness = {
            async putAndGetCatch() {
                await putTestCatch(JSON.stringify({ id: 'harness-catch', notes: 'persisted' }));
                const items = await getAllTestCatches();
                return items.map((item) => JSON.parse(item));
            },
            async readCatches() {
                const items = await getAllTestCatches();
                return items.map((item) => JSON.parse(item));
            },
            async putAndGetPhoto() {
                await putTestCatchPhotograph('harness-photo', new Uint8Array([7, 8, 9]), 'image/jpeg');
                return getTestCatchPhotograph('harness-photo');
            },
            async writeIsolatedRecords() {
                await putTestCatch(JSON.stringify({ id: 'catch-only', notes: 'catch-db' }));
                await putDiagnosticEvent(JSON.stringify({
                    id: 'diag-only',
                    timestampUtc: '2026-01-01T00:00:00.000Z'
                }), 10);
                return {
                    catchStores: await storeNames('FishingLogBook'),
                    diagnosticStores: await storeNames('FishingLogBookDiagnostics'),
                    catches: await window.harness.readCatches()
                };
            },
            async putAndGetProductionCatch() {
                const catchId = '11111111-1111-1111-1111-111111111111';
                const photographId = '22222222-2222-2222-2222-222222222222';
                await putCatchWithPhotographs(
                    JSON.stringify({
                        id: catchId,
                        caughtOn: '2026-08-17T08:00:00+00:00',
                        photographs: [{
                            id: photographId,
                            catchId,
                            contentType: 'image/jpeg'
                        }]
                    }),
                    [{
                        id: photographId,
                        catchId,
                        contentType: 'image/jpeg',
                        bytes: new Uint8Array([1, 2, 3])
                    }]
                );
                return getAllCatchesWithPhotographs(ownerUserId);
            },
            async putAndGetProductionCatchWithThreePhotographs() {
                const catchId = 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa';
                const photoA = '11111111-1111-1111-1111-111111111111';
                const photoB = '22222222-2222-2222-2222-222222222222';
                const photoC = '00000000-0000-0000-0000-000000000003';
                await putCatchWithPhotographs(
                    JSON.stringify({
                        id: catchId,
                        caughtOn: '2026-08-17T08:00:00+00:00',
                        photographs: [
                            { id: photoA, catchId, contentType: 'image/jpeg' },
                            { id: photoB, catchId, contentType: 'image/png' },
                            { id: photoC, catchId, contentType: 'image/webp' }
                        ]
                    }),
                    [
                        { id: photoC, catchId, contentType: 'image/webp', bytes: new Uint8Array([3, 3, 3]) },
                        { id: photoA, catchId, contentType: 'image/jpeg', bytes: new Uint8Array([1, 1, 1]) },
                        { id: photoB, catchId, contentType: 'image/png', bytes: new Uint8Array([2, 2, 2]) }
                    ]
                );
                return getAllCatchesWithPhotographs(ownerUserId);
            },
            async putAndGetProductionCatchWithLocation() {
                const catchId = '11111111-1111-1111-1111-111111111111';
                const photographId = '22222222-2222-2222-2222-222222222222';
                await putCatchWithPhotographs(
                    JSON.stringify({
                        id: catchId,
                        caughtOn: '2026-08-17T08:00:00+00:00',
                        photographs: [{
                            id: photographId,
                            catchId,
                            contentType: 'image/jpeg'
                        }],
                        location: {
                            latitude: 53.2707,
                            longitude: -9.0568,
                            accuracyMetres: 12,
                            capturedOn: '2026-08-17T08:00:00+00:00',
                            source: 'DeviceGps',
                            visibility: 'Private',
                            consentVersion: '1'
                        }
                    }),
                    [{
                        id: photographId,
                        catchId,
                        contentType: 'image/jpeg',
                        bytes: new Uint8Array([1, 2, 3])
                    }]
                );
                return getAllCatchesWithPhotographs(ownerUserId);
            },
            async putLegacyProductionCatchWithoutLocation() {
                const catchId = 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa';
                const photographId = 'bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb';
                await putCatchWithPhotographs(
                    JSON.stringify({
                        id: catchId,
                        caughtOn: '2026-08-17T08:00:00+00:00',
                        photographs: [{
                            id: photographId,
                            catchId,
                            contentType: 'image/jpeg'
                        }]
                    }),
                    [{
                        id: photographId,
                        catchId,
                        contentType: 'image/jpeg',
                        bytes: new Uint8Array([4, 5, 6])
                    }]
                );
                return getAllCatchesWithPhotographs(ownerUserId);
            },
            async readProductionCatches() {
                return getAllCatchesWithPhotographs(ownerUserId);
            },
            async putProductionCatchWithoutPhotographId() {
                try {
                    await putCatchWithPhotographs(
                        JSON.stringify({
                            id: 'orphan-catch',
                            caughtOn: '2026-08-17T08:00:00+00:00'
                        }),
                        [{
                            catchId: 'orphan-catch',
                            contentType: 'image/jpeg',
                            bytes: new Uint8Array([9])
                        }]
                    );
                    return { threw: false, items: await getAllCatchesWithPhotographs(ownerUserId) };
                } catch {
                    return { threw: true, items: await getAllCatchesWithPhotographs(ownerUserId) };
                }
            }
        };

        function storeNames(databaseName) {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(databaseName);
                request.onsuccess = () => {
                    const db = request.result;
                    const names = [...db.objectStoreNames];
                    db.close();
                    resolve(names.sort());
                };
                request.onerror = () => reject(request.error);
            });
        }

        document.getElementById('status').textContent = 'ready';
    </script>
</body>
</html>
