name: mobile-play-bundle

on:
  workflow_dispatch:
    inputs:
      application_version:
        description: Android version code for this Play upload. Leave empty to use the project file. Must increase for every Play upload.
        required: false
        default: ''
        type: string
      application_display_version:
        description: Version name shown to testers. Leave empty to use the project file.
        required: false
        default: ''
        type: string

concurrency:
  group: mobile-play-bundle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android-aab:
    name: Build signed Android App Bundle
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.300'
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Ensure Android SDK dependencies
        run: >-
          dotnet build src/FishingLogBook.Mobile/FishingLogBook.Mobile.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True
      - name: Confirm signing secrets
        run: |
          $required = @(
            'ANDROID_UPLOAD_KEYSTORE_BASE64',
            'ANDROID_UPLOAD_KEYSTORE_PASSWORD',
            'ANDROID_UPLOAD_KEY_ALIAS',
            'ANDROID_UPLOAD_KEY_PASSWORD'
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "Missing required GitHub secrets: $($missing -join ', '). See docs/google-play-internal-testing.md."
          }
      - name: Decode upload keystore
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'catch-upload.keystore'
          $bytes = [Convert]::FromBase64String($env:ANDROID_UPLOAD_KEYSTORE_BASE64)
          if ($bytes.Length -eq 0) {
            throw 'ANDROID_UPLOAD_KEYSTORE_BASE64 decoded to an empty file.'
          }
          [IO.File]::WriteAllBytes($path, $bytes)
          "ANDROID_UPLOAD_KEYSTORE_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Publish signed Android App Bundle
        env:
          APPLICATION_VERSION: ${{ inputs.application_version }}
          APPLICATION_DISPLAY_VERSION: ${{ inputs.application_display_version }}
        run: |
          $properties = @(
            '-f', 'net10.0-android',
            '-c', 'Release',
            '-p:RuntimeIdentifier=android-arm64',
            '-p:MobileEnvironment=Development',
            '-p:AndroidPackageFormats=aab',
            '-p:AndroidKeyStore=true',
            "-p:AndroidSigningKeyStore=$env:ANDROID_UPLOAD_KEYSTORE_PATH",
            '-p:AndroidSigningStorePass=env:ANDROID_UPLOAD_KEYSTORE_PASSWORD',
            "-p:AndroidSigningKeyAlias=$env:ANDROID_UPLOAD_KEY_ALIAS",
            '-p:AndroidSigningKeyPass=env:ANDROID_UPLOAD_KEY_PASSWORD',
            "-p:AndroidSdkDirectory=$env:ANDROID_HOME",
            "-p:JavaSdkDirectory=$env:JAVA_HOME"
          )
          if (-not [string]::IsNullOrWhiteSpace($env:APPLICATION_VERSION)) {
            $properties += "-p:ApplicationVersion=$env:APPLICATION_VERSION"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:APPLICATION_DISPLAY_VERSION)) {
            $properties += "-p:ApplicationDisplayVersion=$env:APPLICATION_DISPLAY_VERSION"
          }
          dotnet publish src/FishingLogBook.Mobile/FishingLogBook.Mobile.csproj @properties
      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: catch-android-internal-testing
          path: src/FishingLogBook.Mobile/bin/Release/net10.0-android/**/*-Signed.aab
          if-no-files-found: error
          retention-days: 14
      - name: Remove upload keystore
        if: always()
        run: |
          if ($env:ANDROID_UPLOAD_KEYSTORE_PATH -and (Test-Path $env:ANDROID_UPLOAD_KEYSTORE_PATH)) {
            Remove-Item $env:ANDROID_UPLOAD_KEYSTORE_PATH -Force
          }
