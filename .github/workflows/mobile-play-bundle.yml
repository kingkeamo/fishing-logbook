name: mobile-play-bundle

on:
  workflow_dispatch:
    inputs:
      publish_to_play:
        description: Publish to Google Play Internal testing. Disable to build the signed AAB artifact only.
        required: true
        default: true
        type: boolean
      application_version:
        description: Version code for artifact-only fallback builds. Published builds always select the next code from Play.
        required: false
        default: ''
        type: string
      application_display_version:
        description: Optional version name shown to testers. Leave empty to use the project value.
        required: false
        default: ''
        type: string
      release_notes:
        description: Optional internal tester release notes (maximum 500 characters).
        required: false
        default: 'Internal testing build.'
        type: string

run-name: ${{ inputs.publish_to_play && 'Publish Catch to Play Internal testing' || 'Build Catch signed AAB only' }}

concurrency:
  group: mobile-play-bundle
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  android-aab:
    name: Build and optionally publish signed Android App Bundle
    runs-on: windows-latest
    timeout-minutes: 60
    environment: google-play-internal
    defaults:
      run:
        shell: pwsh
    env:
      GOOGLE_PLAY_PACKAGE_NAME: com.catchbutdontforget.app
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: throw 'Google Play builds must be dispatched from the main branch.'

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm Google Play OIDC configuration
        if: inputs.publish_to_play
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:WORKLOAD_IDENTITY_PROVIDER)) {
            $missing += 'GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER'
          }
          if ([string]::IsNullOrWhiteSpace($env:SERVICE_ACCOUNT)) {
            $missing += 'GOOGLE_PLAY_SERVICE_ACCOUNT'
          }
          if ($missing.Count -gt 0) {
            throw "Missing required GitHub environment variables: $($missing -join ', '). See docs/google-play-internal-testing.md."
          }

      - name: Authenticate to Google Play for version selection
        if: inputs.publish_to_play
        id: play-auth-version
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Select the next unused Play version code
        if: inputs.publish_to_play
        id: play-version
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.play-auth-version.outputs.access_token }}
        run: node .github/scripts/google-play-release.mjs create-edit

      - name: Resolve release metadata
        env:
          REQUESTED_DISPLAY_VERSION: ${{ inputs.application_display_version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          PLAY_APPLICATION_VERSION: ${{ steps.play-version.outputs.application_version }}
        run: |
          if ($env:RELEASE_NOTES.Length -gt 500) {
            throw 'Google Play release notes must not exceed 500 characters.'
          }
          $displayVersion = $env:REQUESTED_DISPLAY_VERSION
          if ('${{ inputs.publish_to_play }}' -eq 'true' -and [string]::IsNullOrWhiteSpace($displayVersion)) {
            [xml]$project = Get-Content 'src/FishingLogBook.Mobile/FishingLogBook.Mobile.csproj'
            $baseVersion = $project.Project.PropertyGroup.ApplicationDisplayVersion | Select-Object -First 1
            $displayVersion = "$baseVersion-internal.$env:PLAY_APPLICATION_VERSION"
          }
          if (-not [string]::IsNullOrWhiteSpace($displayVersion)) {
            if ($displayVersion -notmatch '^[0-9A-Za-z][0-9A-Za-z._+-]{0,49}$') {
              throw 'The version name must use 1-50 letters, numbers, dots, underscores, plus signs or hyphens.'
            }
            "APPLICATION_DISPLAY_VERSION=$displayVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.300'

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Ensure Android SDK dependencies
        run: >-
          dotnet build src/FishingLogBook.Mobile/FishingLogBook.Mobile.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True

      - name: Confirm signing secrets
        run: |
          $required = @(
            'ANDROID_UPLOAD_KEYSTORE_BASE64',
            'ANDROID_UPLOAD_KEYSTORE_PASSWORD',
            'ANDROID_UPLOAD_KEY_ALIAS',
            'ANDROID_UPLOAD_KEY_PASSWORD'
          )
          $missing = $required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "Missing required GitHub secrets: $($missing -join ', '). See docs/google-play-internal-testing.md."
          }

      - name: Decode upload keystore
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'catch-upload.keystore'
          $bytes = [Convert]::FromBase64String($env:ANDROID_UPLOAD_KEYSTORE_BASE64)
          if ($bytes.Length -eq 0) {
            throw 'ANDROID_UPLOAD_KEYSTORE_BASE64 decoded to an empty file.'
          }
          [IO.File]::WriteAllBytes($path, $bytes)
          "ANDROID_UPLOAD_KEYSTORE_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish signed Android App Bundle
        env:
          PLAY_APPLICATION_VERSION: ${{ steps.play-version.outputs.application_version }}
          FALLBACK_APPLICATION_VERSION: ${{ inputs.application_version }}
        run: |
          $applicationVersion = if ('${{ inputs.publish_to_play }}' -eq 'true') {
            $env:PLAY_APPLICATION_VERSION
          } else {
            $env:FALLBACK_APPLICATION_VERSION
          }
          if ('${{ inputs.publish_to_play }}' -eq 'true' -and [string]::IsNullOrWhiteSpace($applicationVersion)) {
            throw 'Google Play did not provide the next Android version code.'
          }
          if ($applicationVersion -and $applicationVersion -notmatch '^[1-9][0-9]*$') {
            throw 'The Android version code must be a positive integer.'
          }

          $properties = @(
            '-f', 'net10.0-android',
            '-c', 'Release',
            '-p:RuntimeIdentifier=android-arm64',
            '-p:MobileEnvironment=Development',
            '-p:AndroidPackageFormats=aab',
            '-p:AndroidKeyStore=true',
            "-p:AndroidSigningKeyStore=$env:ANDROID_UPLOAD_KEYSTORE_PATH",
            '-p:AndroidSigningStorePass=env:ANDROID_UPLOAD_KEYSTORE_PASSWORD',
            "-p:AndroidSigningKeyAlias=$env:ANDROID_UPLOAD_KEY_ALIAS",
            '-p:AndroidSigningKeyPass=env:ANDROID_UPLOAD_KEY_PASSWORD',
            "-p:AndroidSdkDirectory=$env:ANDROID_HOME",
            "-p:JavaSdkDirectory=$env:JAVA_HOME"
          )
          if (-not [string]::IsNullOrWhiteSpace($applicationVersion)) {
            $properties += "-p:ApplicationVersion=$applicationVersion"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:APPLICATION_DISPLAY_VERSION)) {
            $properties += "-p:ApplicationDisplayVersion=$env:APPLICATION_DISPLAY_VERSION"
          }
          dotnet publish src/FishingLogBook.Mobile/FishingLogBook.Mobile.csproj @properties

      - name: Locate signed Android App Bundle
        id: bundle
        run: |
          $bundles = @(Get-ChildItem 'src/FishingLogBook.Mobile/bin/Release/net10.0-android' -Filter '*-Signed.aab' -Recurse)
          if ($bundles.Count -ne 1) {
            throw "Expected exactly one signed AAB but found $($bundles.Count)."
          }
          "path=$($bundles[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Android App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: catch-android-internal-testing
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Refresh Google Play authentication
        if: inputs.publish_to_play
        id: play-auth-publish
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Publish and commit Internal testing release
        if: inputs.publish_to_play
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.play-auth-publish.outputs.access_token }}
          GOOGLE_PLAY_EDIT_ID: ${{ steps.play-version.outputs.edit_id }}
          APPLICATION_VERSION: ${{ steps.play-version.outputs.application_version }}
          GOOGLE_PLAY_RELEASE_NOTES: ${{ inputs.release_notes }}
          ANDROID_APP_BUNDLE: ${{ steps.bundle.outputs.path }}
        run: node .github/scripts/google-play-release.mjs publish

      - name: Remove upload keystore
        if: always()
        run: |
          if ($env:ANDROID_UPLOAD_KEYSTORE_PATH -and (Test-Path $env:ANDROID_UPLOAD_KEYSTORE_PATH)) {
            Remove-Item $env:ANDROID_UPLOAD_KEYSTORE_PATH -Force
          }
