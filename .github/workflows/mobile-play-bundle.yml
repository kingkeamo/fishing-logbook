name: mobile-play-bundle

on:
  workflow_dispatch:
    inputs:
      publish_to_play:
        description: Publish to Google Play Internal testing. Disable to build the signed AAB artifact only.
        required: true
        default: true
        type: boolean
      application_version:
        description: Version code for artifact-only fallback builds. Published builds always select the next code from Play.
        required: false
        default: ''
        type: string
      application_display_version:
        description: Optional version name shown to testers. Leave empty to use the project value.
        required: false
        default: ''
        type: string
      release_notes:
        description: Optional internal tester release notes (maximum 500 characters).
        required: false
        default: 'Internal testing build.'
        type: string

run-name: ${{ inputs.publish_to_play && 'Publish Catch to Play Internal testing' || 'Build Catch signed AAB only' }}

concurrency:
  group: mobile-play-bundle
  cancel-in-progress: false

jobs:
  artifact-only:
    name: Build signed Android App Bundle only
    if: inputs.publish_to_play == false
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: throw 'Google Play builds must be dispatched from the main branch.'

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.300'

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Ensure Android SDK dependencies
        run: >-
          dotnet build src/FishingLogBook.Mobile/FishingLogBook.Mobile.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True

      - name: Build signed Android App Bundle
        id: bundle
        env:
          APPLICATION_VERSION: ${{ inputs.application_version }}
          APPLICATION_DISPLAY_VERSION: ${{ inputs.application_display_version }}
        run: >-
          .github/scripts/build-signed-android-bundle.ps1
          -ApplicationVersion $env:APPLICATION_VERSION
          -ApplicationDisplayVersion $env:APPLICATION_DISPLAY_VERSION
          -OutputPath $env:GITHUB_OUTPUT

      - name: Upload Android App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: catch-android-internal-testing
          path: ${{ steps.bundle.outputs.bundle_path }}
          if-no-files-found: error
          retention-days: 14

  publish-internal:
    name: Build and publish to Google Play Internal testing
    if: inputs.publish_to_play == true
    runs-on: windows-latest
    timeout-minutes: 60
    environment: google-play-internal
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      GOOGLE_PLAY_PACKAGE_NAME: com.catchbutdontforget.app
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: throw 'Google Play builds must be dispatched from the main branch.'

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm Google Play OIDC configuration
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:WORKLOAD_IDENTITY_PROVIDER)) {
            $missing += 'GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER'
          }
          if ([string]::IsNullOrWhiteSpace($env:SERVICE_ACCOUNT)) {
            $missing += 'GOOGLE_PLAY_SERVICE_ACCOUNT'
          }
          if ($missing.Count -gt 0) {
            throw "Missing required GitHub environment variables: $($missing -join ', '). See docs/google-play-internal-testing.md."
          }

      - name: Authenticate to Google Play for version selection
        id: play-auth-version
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Select the next unused Play version code
        id: play-version
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.play-auth-version.outputs.access_token }}
        run: node .github/scripts/google-play-release.mjs select-version

      - name: Resolve release metadata
        env:
          REQUESTED_DISPLAY_VERSION: ${{ inputs.application_display_version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          PLAY_APPLICATION_VERSION: ${{ steps.play-version.outputs.application_version }}
        run: |
          if ($env:RELEASE_NOTES.Length -gt 500) {
            throw 'Google Play release notes must not exceed 500 characters.'
          }
          $displayVersion = $env:REQUESTED_DISPLAY_VERSION
          if ([string]::IsNullOrWhiteSpace($displayVersion)) {
            [xml]$project = Get-Content 'src/FishingLogBook.Mobile/FishingLogBook.Mobile.csproj'
            $baseVersion = $project.Project.PropertyGroup.ApplicationDisplayVersion | Select-Object -First 1
            $displayVersion = "$baseVersion-internal.$env:PLAY_APPLICATION_VERSION"
          }
          if ($displayVersion -notmatch '^[0-9A-Za-z][0-9A-Za-z._+-]{0,49}$') {
            throw 'The version name must use 1-50 letters, numbers, dots, underscores, plus signs or hyphens.'
          }
          "APPLICATION_DISPLAY_VERSION=$displayVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.300'

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Ensure Android SDK dependencies
        run: >-
          dotnet build src/FishingLogBook.Mobile/FishingLogBook.Mobile.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True

      - name: Build signed Android App Bundle
        id: bundle
        env:
          APPLICATION_VERSION: ${{ steps.play-version.outputs.application_version }}
        run: >-
          .github/scripts/build-signed-android-bundle.ps1
          -ApplicationVersion $env:APPLICATION_VERSION
          -ApplicationDisplayVersion $env:APPLICATION_DISPLAY_VERSION
          -OutputPath $env:GITHUB_OUTPUT

      - name: Upload Android App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: catch-android-internal-testing
          path: ${{ steps.bundle.outputs.bundle_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Refresh Google Play authentication
        id: play-auth-publish
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Publish and commit Internal testing release
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.play-auth-publish.outputs.access_token }}
          APPLICATION_VERSION: ${{ steps.play-version.outputs.application_version }}
          GOOGLE_PLAY_RELEASE_NOTES: ${{ inputs.release_notes }}
          ANDROID_APP_BUNDLE: ${{ steps.bundle.outputs.bundle_path }}
        run: node .github/scripts/google-play-release.mjs publish
