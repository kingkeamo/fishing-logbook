name: build-test

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test .NET solution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FishingLogBook.sln

      - name: Build
        run: dotnet build FishingLogBook.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FishingLogBook.sln --configuration Release --no-build --verbosity normal

  javascript-test:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Test JavaScript
        run: npm test

  deployment-config-test:
    name: Deployment configuration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: >-
          node --test
          .github/scripts/release-version.test.mjs
          src/FishingLogBook.Web/build/configure-web.test.mjs
          src/FishingLogBook.Root/build/root-site.test.mjs

  javascript-browser-test:
    name: JavaScript browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Web dependencies
        run: dotnet restore src/FishingLogBook.Web/FishingLogBook.Web.csproj

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Test JavaScript browsers
        run: npm run test:browser

  terraform-validate:
    name: Validate Terraform (validation only, never apply)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  cognito-lambda-test:
    name: Cognito pre-token Lambda tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test pre-token generation Lambda
        run: node --test
        working-directory: infrastructure/terraform/modules/cognito/lambda

