name: deploy-web

# Deploy the PWA to the already-created Cloudflare Pages project after a merge to main.
# Never create or delete the Pages project from CI (Terraform owns that).
on:
  push:
    branches: [main]

concurrency:
  group: deploy-web-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FishingLogBook.Web.slnf

      - name: Build
        run: dotnet build FishingLogBook.Web.slnf --configuration Release --no-restore

      - name: Test
        run: dotnet test FishingLogBook.Web.slnf --configuration Release --no-build --verbosity normal

  deploy:
    name: Deploy PWA to Cloudflare Pages (dev)
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # This repository's Release/Pages publish uses appsettings.Production.json as the
      # Dev Cloudflare Pages overlay. GitHub `dev` environment AUTH_* variables must be
      # set; missing values fail this step instead of emitting Dev defaults.
      - name: Apply public Auth configuration
        env:
          API_BASE_URL: https://fishing-logbook-dev-api.fly.dev
          AUTH_AUTHORITY: ${{ vars.AUTH_AUTHORITY }}
          AUTH_CLIENT_ID: ${{ vars.AUTH_CLIENT_ID }}
          AUTH_HOSTED_UI_DOMAIN: ${{ vars.AUTH_HOSTED_UI_DOMAIN }}
          AUTH_API_SCOPE: ${{ vars.AUTH_API_SCOPE }}
          AUTH_API_RESOURCE: ${{ vars.AUTH_API_RESOURCE }}
          BUILD_VERSION: 0.0.0-dev.${{ github.run_number }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_ENVIRONMENT: dev
          BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: >-
          node src/FishingLogBook.Web/build/configure-web.mjs
          --environment dev
          --template src/FishingLogBook.Web/wwwroot/appsettings.Production.json
          --output src/FishingLogBook.Web/wwwroot/appsettings.Production.json

      - name: Publish Web
        run: dotnet publish src/FishingLogBook.Web --configuration Release -o artifacts/web

      # Dev-only native App Link / Universal Link association. The Apple file is generated
      # only when the public APPLE_TEAM_ID variable holds a valid team identifier.
      - name: Add Dev native app link association
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: >-
          node src/FishingLogBook.Web/build/configure-app-links.mjs
          --environment dev
          --config src/FishingLogBook.Web/build/app-links.dev.json
          --output artifacts/web/wwwroot

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.86.0'
          command: pages deploy artifacts/web/wwwroot --project-name fishing-logbook-dev --branch develop

      - name: Smoke check
        run: |
          set -euo pipefail
          url="https://fishing-logbook-dev.pages.dev/"
          echo "Checking ${url}"
          body="$(curl -fsS --retry 8 --retry-all-errors --retry-delay 5 "${url}")"
          echo "${body}" | grep -q "FishingLogBook"

      # The association files must be served directly as JSON, never as the SPA shell.
      - name: Native app association smoke check
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          check_association() {
            local path="$1" expected="$2"
            local url="https://fishing-logbook-dev.pages.dev${path}"
            local headers body status
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl -sS --retry 8 --retry-all-errors --retry-delay 5 -D "${headers}" -o "${body}" -w '%{http_code}' "${url}")"
            [ "${status}" = "200" ] || { echo "${path} returned HTTP ${status}"; exit 1; }
            grep -qiE '^content-type: application/json' "${headers}" || { echo "${path} is not served as application/json"; exit 1; }
            ! grep -qi '<html' "${body}" || { echo "${path} returned the SPA shell"; exit 1; }
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "${body}"
            grep -q "${expected}" "${body}" || { echo "${path} does not reference ${expected}"; exit 1; }
            echo "${path} OK"
          }
          check_association /.well-known/assetlinks.json com.fishinglogbook.mobile.demo
          if [ -n "${APPLE_TEAM_ID}" ]; then
            check_association /.well-known/apple-app-site-association "${APPLE_TEAM_ID}.com.fishinglogbook.mobile.demo"
          else
            echo "APPLE_TEAM_ID is not set: apple-app-site-association is intentionally not published."
          fi
