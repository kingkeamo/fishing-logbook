name: mobile-build-test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android and test presentation
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.300'

      # Run net10.0 presentation tests before any MAUI/Android build. On windows-latest,
      # testhost has hung indefinitely at start after building FishingLogBook.Mobile.slnx
      # (multi-TFM Android) once Microsoft.Data.Sqlite native load is in the suite.
      - name: Test mobile presentation
        timeout-minutes: 10
        run: >-
          dotnet test tests/FishingLogBook.Mobile.Tests/FishingLogBook.Mobile.Tests.csproj
          -f net10.0
          --verbosity normal
          --results-directory "${{ github.workspace }}/mobile-test-results"
          --blame-hang
          --blame-hang-timeout 2m

      - name: Upload mobile test hang diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-hang-diagnostics
          path: |
            mobile-test-results/
            tests/FishingLogBook.Mobile.Tests/TestResults/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Ensure Android SDK dependencies
        run: >-
          dotnet build src/FishingLogBook.Mobile/FishingLogBook.Mobile.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True
      - name: Build separate mobile solution
        run: >-
          dotnet build FishingLogBook.Mobile.slnx
          "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME"
      - name: Build trimmed ARM64 release APK
        run: >-
          dotnet build src/FishingLogBook.Mobile/FishingLogBook.Mobile.csproj
          -f net10.0-android -c Release -p:RuntimeIdentifier=android-arm64 -p:AndroidPackageFormats=apk
          "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME"

  ios:
    name: Build iOS simulator
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DOTNET_SDK_VERSION: '10.0.300'
      DOTNET_WORKLOAD_SET: '10.0.300.3'
      XCODE_APP: /Applications/Xcode_26.5.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
      - name: Select Xcode 26.5
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "Expected $XCODE_APP for .NET $DOTNET_SDK_VERSION / workload set $DOTNET_WORKLOAD_SET."
            ls /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
      # On macOS the Mobile project includes net10.0-android and net10.0-ios, so
      # restore during test requires both MAUI workloads even when tests target net10.0.
      - name: Install MAUI Android and iOS workloads
        run: >-
          dotnet workload install maui-android maui-ios
          --version ${{ env.DOTNET_WORKLOAD_SET }}
      - name: Test mobile presentation
        run: >-
          dotnet test tests/FishingLogBook.Mobile.Tests/FishingLogBook.Mobile.Tests.csproj
          -f net10.0 --verbosity normal
      - name: Build unsigned iOS simulator
        run: >-
          dotnet build src/FishingLogBook.Mobile/FishingLogBook.Mobile.csproj
          -f net10.0-ios -c Debug
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:EnableCodeSigning=false
          -p:BuildIpa=false
      - name: Assert generated iOS App Store icon has no alpha
        run: node .github/scripts/ios-app-icon-png.mjs assert-generated src/FishingLogBook.Mobile
